[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inspection-copilot"
version = "0.1.0"
description = "RAG + tool-calling assistant for powerline insulator inspection, built on YOLOv8 detections"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ganapathi Teja Chirravuri" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.2",
    "pydantic-settings>=2.4",
    "anthropic>=2.0",
    "truststore>=0.10",
    "python-multipart>=0.0.9",  # file uploads in FastAPI
]

[project.optional-dependencies]
# Embeddings and PDF parsing. Separate so CI (which uses fake embeddings) installs quickly.
# Install CPU-only torch first:  pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = [
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "ultralytics>=8.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspection_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs a running PostgreSQL with pgvector (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
